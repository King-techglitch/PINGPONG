<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PINGPONG GAME</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Pong</h1>
    <div class="scoreboard">
      <div id="playerScore" class="score">0</div>
      <div class="score-label">—</div>
      <div id="computerScore" class="score">0</div>
    </div>
    <canvas id="game" width="800" height="500"></canvas>
    <p class="controls">Controls: Move mouse over the canvas or use Arrow Up / Arrow Down to move the left paddle.</p>
    <button id="restart">Restart Scores & Reset</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
